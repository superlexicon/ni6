[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
name = "photoholmes"
version = "0.1.0"
description = "Integrated PhotoHolmes for IM-OSINT"
authors = ["IM-OSINT Team"]

[tool.poetry.dependencies]
python = ">=3.10,<3.13"
torch = "^2.4.0"
torchvision = "^0.19.0"
numpy = ">=1.26.0,<2.0.0"
scikit-image = "^0.25.2"
matplotlib = "^3.7.0"
scipy = ">=1.10.0,<2.0.0"
pillow = "^11.3.0"